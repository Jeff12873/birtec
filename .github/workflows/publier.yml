# À chaque envoi sur « main » : fabrique birtec.zip (l'application seule) et le publie dans les Releases GitHub.
# C'est ce paquet que l'installateur KTEC télécharge ; le socle commun (serveur, IA, Java, BIRT) vient de KTEC.

name: Publier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Le socle de K.NOVA (son interface) : BiRTEC éco+ l'embarque dans sa page.
      - uses: actions/checkout@v4
        with:
          repository: Jeff12873/ktec
          path: ktec

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Vérification du code
        run: |
          for fichier in $(git ls-files '*.js' | grep -v vendor/); do node --check "$fichier"; done

      - name: birtec.zip
        run: |
          version="$(cat VERSION).${{ github.run_number }}"
          echo "$version" > VERSION
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist/birtec/eco
          cp -r app.json blocs interface docs VERSION package.json README.md nouveautes.json dist/birtec/
          # BiRTEC éco+ : la page HTML seule, téléchargeable depuis la page de présentation de K.NOVA, et dans le
          # paquet (la pastille « Eco+ » du portail la sert avec le schéma du site)
          node eco/fabriquer.js dist/BiRTEC-eco.html --ktec ktec
          cp dist/BiRTEC-eco.html dist/birtec/eco/BiRTEC-eco.html
          (cd dist && zip -qr birtec.zip birtec)

      - name: Release
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" dist/birtec.zip dist/BiRTEC-eco.html --title "BiRTEC $VERSION" --notes "${NOTES:-Nouvelle version}"
          # On garde les 3 dernières versions
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | while read -r ancienne; do
            gh release delete "$ancienne" --yes --cleanup-tag
          done
